<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Blast</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-board">
      <div id="stars"></div>
      <div id="asteroids"></div>
      <div id="bullet"></div>
      <div id="ship">
        <img src="ship.gif" alt="Spaceship" />
      </div>
      <div id="score">Score: 0</div>
      <div id="game-over">GAME OVER</div>
      <div id="restart">↻</div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
